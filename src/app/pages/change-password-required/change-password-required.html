<div class="cpr-page">
  <div class="cpr-card">
    <img src="assets/images/Fluentiq_black.png" alt="FluentIQ" class="cpr-logo" />

    <h1 class="cpr-title">
      @if (displayName()) {
        Hi {{ displayName() }} — set a new password to continue
      } @else {
        Set a new password to continue
      }
    </h1>

    <p class="cpr-explainer">
      You signed in with a temporary password. Choose a new password before
      you can use the rest of the app.
    </p>

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="cprCurrent">Current (temporary) password</label>
        <input
          type="password"
          id="cprCurrent"
          name="cprCurrent"
          required
          autocomplete="current-password"
          [(ngModel)]="current"
          [disabled]="submitting()" />
      </div>

      <div class="field">
        <label for="cprNext">New password</label>
        <input
          type="password"
          id="cprNext"
          name="cprNext"
          required
          autocomplete="new-password"
          placeholder="minimum 6 characters"
          [(ngModel)]="next"
          [disabled]="submitting()" />
      </div>

      <div class="field">
        <label for="cprConfirm">Confirm new password</label>
        <input
          type="password"
          id="cprConfirm"
          name="cprConfirm"
          required
          autocomplete="new-password"
          [(ngModel)]="confirm"
          [disabled]="submitting()" />
      </div>

      @if (errorMessage()) {
        <div class="cpr-error">{{ errorMessage() }}</div>
      }

      <button type="submit" class="cpr-submit" [disabled]="submitting()">
        @if (submitting()) {
          Saving…
        } @else {
          SET NEW PASSWORD
        }
      </button>
    </form>

    <button type="button" class="cpr-logout" (click)="onLogout()">
      Log out
    </button>
  </div>
</div>
