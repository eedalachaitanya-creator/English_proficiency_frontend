<div class="login-container">

  <!-- LEFT IMAGE SECTION -->
  <div class="left-section">
    <!-- <div class="overlay">
      <h1>Travelista Tours</h1>
      <p>Travel is the only purchase that enriches you in ways beyond material wealth</p>
    </div> -->
  </div>

  <!-- RIGHT LOGIN SECTION -->
  <div class="right-section">
    <div class="login-box">
      <div class="brand"> <span alt="Logo" class="logo_black"> </span></div>
      <!-- <h2>Welcome</h2> -->
      <!-- <p>Login with Email</p> -->

      <!-- Tabs -->
      <div class="custom-tabs">
        <button 
          class="tab-btn"
          [class.active]="activeTab === 'admin'" 
          (click)="setActiveTab('admin')">
          Admin
        </button>

        <button 
          class="tab-btn"
          [class.active]="activeTab === 'hr'" 
          (click)="setActiveTab('hr')">
          HR
        </button>
      </div>

      <!-- ADMIN -->
      <form *ngIf="activeTab === 'admin'" (ngSubmit)="onAdminSubmit()">

        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email"
            placeholder="admin@company.com"
            [(ngModel)]="adminEmail"
            name="adminEmail"
            required>
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password"
            placeholder="••••••••"
            [(ngModel)]="adminPassword"
            name="adminPassword"
            required>
        </div>

        <div class="error" *ngIf="adminError()">
          {{ adminError() }}
        </div>

        <button class="btn" [disabled]="adminSubmitting()">
          {{ adminSubmitting() ? 'Signing in…' : 'LOGIN' }}
        </button>

        <p class="forgot">
          <a href="#" (click)="$event.preventDefault(); openForgot()">
            Forgot your password?
          </a>
        </p>
      </form>

      <!-- HR -->
      <form *ngIf="activeTab === 'hr'" (ngSubmit)="onHrSubmit()">

        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email"
            placeholder="you@company.com"
            [(ngModel)]="hrEmail"
            name="hrEmail"
            required>
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password"
            placeholder="••••••••"
            [(ngModel)]="hrPassword"
            name="hrPassword"
            required>
        </div>

        <div class="error" *ngIf="hrError()">
          {{ hrError() }}
        </div>

        <button class="btn" [disabled]="hrSubmitting()">
          {{ hrSubmitting() ? 'Signing in…' : 'LOGIN' }}
        </button>

        <p class="forgot">
          <a href="#" (click)="$event.preventDefault(); openForgot()">
            Forgot your password?
          </a>
        </p>
      </form>

    
    </div>
    
    <div class="powered-text">
        <p > Powered by Stixis AI Solutions,  &copy; Copyright 2026-2027</p>
    </div>
    
  </div>
</div>

<!-- <app-footer></app-footer> -->

<!-- Forgot Modal — role tracks the active tab so the modal posts to
     the matching backend endpoint (/api/hr/... or /api/admin/...). -->
@if (forgotOpen()) {
  <app-forgot-password-modal [role]="activeTab" (closed)="closeForgot()"></app-forgot-password-modal>
}
