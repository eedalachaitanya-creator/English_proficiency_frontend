<div class="account-menu-wrap">

  <!-- Avatar trigger. Renders a Font Awesome person silhouette
       instead of the user's first initial — more recognizable as a
       profile/account affordance, and avoids the "what does the
       letter mean?" question new users had. -->
  <button
    type="button"
    class="account-avatar"
    [class.open]="open()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [attr.aria-label]="'Account menu for ' + displayName()"
    (click)="toggle()">
    <i class="fas fa-user" aria-hidden="true"></i>
  </button>

  <!-- Dropdown -->
  @if (open()) {
    <div class="account-menu" role="menu">

      <!-- Header: name + email -->
      <div class="account-menu-header">
        <div class="account-menu-name">{{ displayName() }}</div>
        @if (email) {
          <div class="account-menu-email">{{ email }}</div>
        }
      </div>

      <div class="account-menu-divider"></div>

      <!-- Items -->
      @if (showChangePassword) {
        <button
          type="button"
          class="account-menu-item"
          role="menuitem"
          (click)="onChangePassword()">
          Change password
        </button>
      }

      <button
        type="button"
        class="account-menu-item account-menu-item-danger"
        role="menuitem"
        (click)="onLogout()">
        Logout
      </button>

    </div>
  }
</div>

<!-- Change-password modal lives here so every parent page gets it for
     free by just dropping in <app-account-menu>. -->
@if (modalOpen()) {
  <app-change-password-modal (closed)="onModalClosed()"></app-change-password-modal>
}
