<div class="change-pw-overlay" (click)="onCancel()">
  <div class="card change-pw-card" (click)="$event.stopPropagation()">

    <h2 style="margin: 0 0 6px 0;">Change password</h2>
    <p class="subtitle" style="margin: 0 0 16px 0;">
      You'll stay logged in after changing your password.
    </p>

    @if (successMessage()) {
      <div class="notice" style="background: var(--green-soft, #e7f6e7); border-left: 3px solid var(--green, #2f8d3a);">
        ✓ {{ successMessage() }}
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" novalidate>

        <div class="field">
          <label for="cpCurrent">Current password</label>
          <input
            type="password"
            id="cpCurrent"
            name="cpCurrent"
            required
            autocomplete="current-password"
            [(ngModel)]="current"
            [disabled]="submitting()">
        </div>

        <div class="field">
          <label for="cpNext">New password</label>
          <input
            type="password"
            id="cpNext"
            name="cpNext"
            required
            autocomplete="new-password"
            placeholder="minimum 6 characters"
            [(ngModel)]="next"
            [disabled]="submitting()">
        </div>

        <div class="field">
          <label for="cpConfirm">Confirm new password</label>
          <input
            type="password"
            id="cpConfirm"
            name="cpConfirm"
            required
            autocomplete="new-password"
            [(ngModel)]="confirm"
            [disabled]="submitting()">
        </div>

        <div class="field-error">
          @if (errorMessage()) {
            {{ errorMessage() }}
          }
        </div>

        <div class="flex-row mt-4" style="justify-content: flex-end; gap: 12px;">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="onCancel()"
            [disabled]="submitting()">
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="submitting()">
            @if (submitting()) {
              Saving…
            } @else {
              CHANGE PASSWORD
            }
          </button>
        </div>

      </form>
    }
  </div>
</div>
