

      <!-- Backdrop click is intentionally NOT bound to onCancel() — the
           change-password modal must only close via the explicit X
           button or Cancel button. Accidental clicks outside the form
           used to discard whatever the user had typed; that's the bug
           this commit fixes. The backdrop still serves as the dim
           overlay; it just no longer dismisses the modal. -->
      <div class="modal-backdrop show">
    <div class="modal">
      <div class="modal-header">
        <h2>Change password</h2>
        <p class="subtitle">You'll stay logged in after changing your password.</p>
        <a class="close-btn" (click)="onCancel()" aria-label="Close">
          ✕
        </a>
      </div>

    @if (successMessage()) {
      <div class="notice" style="background: var(--green-soft, #e7f6e7); border-left: 3px solid var(--green, #2f8d3a);">
        ✓ {{ successMessage() }}
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="cpCurrent">Current password <span style="color: red;">*</span></label>
          <input
            type="password"
            id="cpCurrent"
            name="cpCurrent"
            required
            autocomplete="current-password"
            [(ngModel)]="current"
            (keydown)="blockSpace($event)"
            [disabled]="submitting()">
        </div>

        <div class="field">
          <label for="cpNext">New password <span style="color: red;">*</span></label>
          <input
            type="password"
            id="cpNext"
            name="cpNext"
            required
            autocomplete="new-password"
            placeholder="minimum 6 characters"
            [(ngModel)]="next"
            (keydown)="blockSpace($event)"
            [disabled]="submitting()">
          <!-- Inline rules hint — surfaces the same constraints the
               backend enforces (6-128 chars, no whitespace) so the
               user knows what's expected before they hit Submit. -->
          <small class="text-muted" style="display:block; margin-top:6px; font-size:12px; line-height:1.5;">
            6&ndash;128 characters. Letters, numbers, and special
            characters like <code>@ _ ! # $ % &amp;</code> are allowed.
            Spaces and tabs are not.
          </small>
        </div>

        <div class="field">
          <label for="cpConfirm">Confirm new password <span style="color: red;">*</span></label>
          <input
            type="password"
            id="cpConfirm"
            name="cpConfirm"
            required
            autocomplete="new-password"
            [(ngModel)]="confirm"
            (keydown)="blockSpace($event)"
            [disabled]="submitting()">
        </div>

        <div class="field-error">
          @if (errorMessage()) {
            {{ errorMessage() }}
          }
        </div>

        <div class="flex-row mt-4" style="justify-content: flex-end; gap: 12px;">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="onCancel()"
            [disabled]="submitting()">
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="submitting()">
            @if (submitting()) {
              Saving…
            } @else {
              CHANGE PASSWORD
            }
          </button>
        </div>
        </div>
      </form>
    }
  </div>
</div>
