<div class="modal-backdrop show" style="z-index: 1100;" (click)="onCancel()">
  <div class="modal forgot-pw-card" (click)="$event.stopPropagation()">

    <h2 style="margin: 0 0 6px 0;">Forgot password</h2>
    <p class="subtitle" style="margin: 0 0 16px 0;">
      Enter your HR account email. We'll send you a temporary password
      to log in with — change it from your account menu after sign-in.
    </p>

    @if (successMessage()) {
      <div class="notice" style="background: var(--green-soft, #e7f6e7); border-left: 3px solid var(--green, #2f8d3a);">
        ✓ {{ successMessage() }}
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" novalidate>

        <div class="field">
          <label for="forgotEmail">Email</label>
          <input
            type="email"
            id="forgotEmail"
            name="forgotEmail"
            required
            autofocus
            autocomplete="email"
            placeholder="you@company.com"
            [(ngModel)]="email"
            [disabled]="submitting()">
        </div>

        <div class="field-error">
          @if (errorMessage()) {
            {{ errorMessage() }}
          }
        </div>

        <div class="flex-row mt-4" style="justify-content: flex-end; gap: 12px;">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="onCancel()"
            [disabled]="submitting()">
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="submitting()">
            @if (submitting()) {
              Sending…
            } @else {
              SEND TEMPORARY PASSWORD
            }
          </button>
        </div>

      </form>
    }
  </div>
</div>
